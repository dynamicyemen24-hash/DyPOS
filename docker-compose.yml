services:
  # ── Single-writer API (SQLite is single-writer: scale reads via replicas of
  #    this image behind nginx, writes go to this primary) ──
  dypos-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: dypos-server:1.25.1
    container_name: dypos-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DYPOS_PORT=3001
      - DYPOS_HOST=0.0.0.0
      - DYPOS_CLUSTER=1
      - DYPOS_CORS_ORIGIN=https://pos.example.com
      - DYPOS_DB_PATH=/app/data/dypos.db
      - DYPOS_JWT_SECRET=${DYPOS_JWT_SECRET:?Set DYPOS_JWT_SECRET in .env}
      - DYPOS_JWT_EXPIRES=24h
      - DYPOS_BODY_LIMIT=1mb
      - DYPOS_METRICS_TOKEN=${DYPOS_METRICS_TOKEN:-}
    volumes:
      - dypos-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const o={host:'localhost',port:3001,path:'/api/ready',timeout:3000};const r=http.get(o,x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(3000,()=>{r.destroy();process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Edge reverse-proxy: TLS termination, gzip, caching of /pos assets ──
  #    Uncomment when deploying behind a domain. Requires ./nginx.conf + certs.
  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     dypos-server:
  #       condition: service_healthy

  # ── Nightly offline backup sidecar (VACUUM INTO + retention + optional S3) ──
  dypos-backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: dypos-server:1.25.1
    restart: unless-stopped
    command: ["sh", "-c", "while true; do node scripts/backup.mjs; sleep 86400; done"]
    environment:
      - DYPOS_DB_PATH=/app/data/dypos.db
      - DYPOS_BACKUP_DIR=/app/data/backups
      - DYPOS_BACKUP_RETENTION=${DYPOS_BACKUP_RETENTION:-7}
      - DYPOS_BACKUP_S3=${DYPOS_BACKUP_S3:-}
    volumes:
      - dypos-data:/app/data
    depends_on:
      dypos-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Monitoring (opt-in): Prometheus + alerts ──
  #    Run: docker compose --profile monitoring up -d prometheus
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./server/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./server/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      dypos-server:
        condition: service_healthy

volumes:
  dypos-data:
