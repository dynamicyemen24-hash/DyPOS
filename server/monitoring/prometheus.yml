# DyPOS Prometheus — scrape the Node API + itself.
# Run: docker compose --profile monitoring up prometheus
# If DYPOS_METRICS_TOKEN is set, put it in `params: { token: [...] }`
# or uncomment the x-metrics-token header below.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dypos-api
    static_configs:
      - targets: ['dypos-server:3001']
    metrics_path: /api/metrics
    # params:
    #   token: ['${DYPOS_METRICS_TOKEN}']
    # headers:
    #   x-metrics-token: '${DYPOS_METRICS_TOKEN}'
    scrape_timeout: 10s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
