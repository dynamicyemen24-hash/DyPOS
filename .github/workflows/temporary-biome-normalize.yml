name: Temporary Biome normalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: biome normalize') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Normalize repository formatting
        run: |
          set -e
          cd POS
          npm ci --no-audit --no-fund
          npx biome format --write .
          cd ../server
          npm ci --no-audit --no-fund
          npx biome check --write .
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "DyPOS Release Automation"
          git config user.email "dypOS-release@users.noreply.github.com"
          git add POS server
          git commit -m "chore: biome normalize production source"
          git push
