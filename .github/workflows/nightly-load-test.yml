# Nightly Load Test — k6 against a freshly booted API.
#
# Why this shape: the previous job claimed to stress "staging
# (staging.dypos.smartportssoft.com)", a host that does not resolve, ran `k6`
# without ever installing it (the k6-action only *builds* a Docker image), and
# then parsed `--out json=` output — which is NDJSON, not a JSON object — with
# JSON.parse(). Three independent reasons it could never pass, so it reported
# nothing for as long as it existed.
#
# Now: k6 is installed, the API is booted from THIS commit (server/entrypoint.js,
# migrations + real SQLite, temp DB) and measured on localhost. That is a real
# invoice-path number on every run — no phantom environment required.
# Pass `base_url` manually to measure an external Express origin instead
# (an origin that answers /api/ping with a demo Worker is NOT a valid target for
# the invoice flow — the script registers a user and posts invoices).
#
# SLOs live in the script itself (server/tests/load/k6-invoices.js):
# p(95) < 800ms, http_req_failed < 1%. k6 exits non-zero on a threshold breach,
# and the reporting step refuses to pass when it cannot find a measurement.
name: Nightly Load Test

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC (06:00 AST)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'External API origin (leave empty to boot server/ locally)'
        required: false
        default: ''

concurrency:
  group: nightly-load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: k6 invoice load test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://127.0.0.1:3001' }}
      LOCAL_TARGET: ${{ github.event.inputs.base_url == '' && '1' || '0' }}

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Node 22
        if: env.LOCAL_TARGET == '1'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install + boot the API from this commit (fresh SQLite)
        if: env.LOCAL_TARGET == '1'
        working-directory: server
        run: |
          set -e
          npm ci --no-audit --no-fund
          # The load-test budget MUST be raised here, and the code already says so:
          # server/middleware/rate-limiters.js states in its own header that both
          # limits are env-tunable "BECAUSE the load test needs them raised without
          # touching code". This step never passed them, so the job spent the whole
          # run measuring the limiter instead of the invoice path.
          #
          # Proof (server/tests/load/repro-rate-wall.mjs, same request shape as k6):
          #   without this -> 2xx=996  429=404  (the limiter closes at 1000/15min)
          #   with this    -> 2xx=1400 429=0
          # and 996 is exactly the `checks_passes` the nightly run reported.
          #
          # 200000 is ~8x the 25,813 requests the last run issued, so the SLOs
          # measure the invoice path — and it stays FINITE, so flood protection is
          # still switched on. The auth limiter is deliberately left at its default:
          # setup() logs in once per run and successful logins are not counted.
          DYPOS_PORT=3001 \
          DYPOS_HOST=127.0.0.1 \
          DYPOS_DB_PATH="$RUNNER_TEMP/dypos-load.db" \
          DYPOS_JWT_SECRET="load-test-jwt-secret-32-characters-minimum" \
          DYPOS_RATE_LIMIT_MAX=200000 \
            nohup node entrypoint.js > "$RUNNER_TEMP/dypos-server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3001/api/ready > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready in 60s"
          tail -40 "$RUNNER_TEMP/dypos-server.log"
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # Stages, SLO thresholds AND the JSON report come from the script itself
      # (`handleSummary()` writes k6-summary.json via SUMMARY_PATH) — no
      # deprecated `--summary-export` flag, no `--vus/--duration` contradicting
      # the script's stages. A threshold breach makes k6 exit non-zero here.
      - name: Run k6 invoice stress test
        run: |
          set -e
          k6 run \
            -e BASE="${BASE_URL}" \
            -e SUMMARY_PATH="$RUNNER_TEMP/k6-summary.json" \
            server/tests/load/k6-invoices.js

      - name: Report p95 + error rate (refuses to pass without a measurement)
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/k6-summary.json"
          if [ ! -s "$SUMMARY" ]; then
            echo "::error::no k6 report at $SUMMARY — the load test produced no measurement (this is a failure, not a pass)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const p95 = typeof r.p95_ms === "number" ? r.p95_ms : null;
            const failed = typeof r.http_req_failed === "number" ? r.http_req_failed : null;
            const pct = failed === null ? "n/a" : (failed * 100).toFixed(2) + "%";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## k6 invoice path (${r.base})\n- p(95): ${p95 === null ? "missing" : p95.toFixed(1) + "ms"} (SLO < 800ms)\n- http_req_failed: ${pct} (SLO < 1%)\n- http_reqs: ${r.http_reqs} | checks: ${r.checks_passes} passed / ${r.checks_fails} failed\n`);
            console.log("p95:", p95, "ms | http_req_failed:", pct, "| requests:", r.http_reqs);
            if (p95 === null) { console.error("::error::k6 report has no p95_ms value"); process.exit(1); }
            if (p95 > 800) { console.error("::error::p95 above the 800ms SLO"); process.exit(1); }
            if (failed !== null && failed > 0.01) { console.error("::error::error rate above the 1% SLO"); process.exit(1); }
          ' "$SUMMARY"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            ${{ runner.temp }}/k6-summary.json
            ${{ runner.temp }}/dypos-server.log
          if-no-files-found: warn
          retention-days: 30