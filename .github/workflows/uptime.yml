# Uptime Monitor — the production heartbeat.
#
# Every 15 minutes this asks the ONE question a customer would ask: "does the
# live domain serve the build this repo calls released?" The probe itself lives
# in `scripts/verify-live.mjs` — the same script the deploy workflow and a human
# release check run, so the heartbeat cannot drift from what "live" means:
#   /version.json must equal the root package.json version (single source),
#   the shell must reference a hashed bundle that actually 200s, /sw.js and
#   /manifest.webmanifest must be served (offline-first + installable), a deep
#   link must render the SPA shell, and /api/ping must answer on this origin.
#
# Paths matter: the old probes (`/assets/DyPOS/pos/version.json`, a `?v=`-pinned
# bundle) belonged to the retired Worker layout, so the heartbeat failed every
# run on a perfectly healthy site. A monitor that lies is worse than none.
name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Origin to probe (default: production custom domain)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: Probe live site
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify the live domain serves this release
        run: node scripts/verify-live.mjs --site="${{ github.event.inputs.site || 'https://dypos.smartportssoft.com' }}"
