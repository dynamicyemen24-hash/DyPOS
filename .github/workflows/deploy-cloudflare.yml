name: Deploy to Cloudflare (production)

# أي تعديل يُدمج في main يُبنى ويُنشر تلقائيًا إلى مشروع Cloudflare Pages
# (dypos-pos → dypos.smartportssoft.com) ثم يتحقق حيًا أن العملاء يرون الإصدار الجديد.
#
# نطاق الواجهة مُثبَت على مشروع Pages، ومسار `/api/*` مُثبت على Worker مستقل
# اسمه `dypos-api`. يُنشر الاثنان من نفس الإصدار حتى لا تعرض الواجهة نسخة أحدث
# من واجهة API أو العكس. يحتاج التوكن إلى Pages:Edit وWorkers Scripts:Edit،
# وإلى Zone Workers Routes:Edit إذا كان النشر سيحدّث route لأول مرة.
#
# التخطيط: `build:pages` (base "/"، ويمسح outDir) هو نفس البناء الذي يخدم الإنتاج
# اليوم، وينتج `sw.js` في جذر النطاق بمدى "/" — وهو شرط تحكّم Service Worker
# في النطاق كاملًا. وحجم الميزانية يُقرأ من المخرجات نفسها.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build → Pages deploy → live verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version (single source = root package.json)
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm ci` مقصود: لا يوجد yarn.lock متتبَّع في المستودع، فكان `yarn install`
      # يحلّ نسخًا عائمة في كل تشغيل، أي أن البناء الذي نتحقّق منه في CI ليس
      # نفس البناء المنشور. `npm ci` يثبّت POS/package-lock.json حرفيًا.
      - name: Install frontend dependencies
        working-directory: POS
        run: npm ci --no-audit --no-fund

      - name: Quality gate (vitest + noConsole lint)
        working-directory: POS
        run: npm run verify

      # Backend gates (deterministic subset of CI): the POS talks to the
      # method-router contract, so a deploy must prove it
      # (every POS call site resolves), lint, and schema parity. The full
      # backend suite + backup drills run in CI (server-api job).
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Backend gates (lint + method contract + schema parity)
        working-directory: server
        run: npm run lint && npm run contract && npm run parity

      # Shift-left for the UPSTREAM_MISCONFIGURED outage (red since 1.40.0):
      # a checked-in BACKEND_URL that resolves to the edge itself must fail the
      # deploy HERE, not as a red heartbeat 15 minutes later. The upstream is a
      # wrangler secret (never in repo); this gate proves the repo carries no
      # dead default that could re-clobber it.
      - name: API upstream config gate
        working-directory: server
        run: npm run upstream

      # نفس البناء الذي يخدم الإنتاج: base "/" و sw.js في جذر النطاق، ويمسح
      # outDir أولًا فلا تتراكم قطع قديمة في قائمة precache (انظر pruneStaleAssetsPlugin).
      - name: Build frontend (version-pinned, no timestamps)
        working-directory: POS
        run: npm run build:pages
        env:
          DyPOS_BUILD_VERSION: ${{ steps.ver.outputs.version }}

      # Efficiency gate: fail the deploy on bundle bloat (900KB gzip budget).
      - name: Bundle budget (gzip JS+CSS cap)
        working-directory: POS
        run: npm run size

      # لا حاجة لتجميع موقع Worker: مخرجات build:pages هي موقع Pages كاملًا
      # (index.html + assets/ + sw.js + _headers + locales/ + workers/).
      # _redirects لا يُرفع: Pages يخدم fallback عبر قواعد النطاق، ووجود
      # catch-all في الملف كان مصدر حلقة إعادة توجيه لا نهائية (code 100324).

      # ── Production safety gate ──
      # A production push must never be reported green while deployment was
      # silently skipped. The previous "warning + skip" behavior allowed main
      # to advance while customers remained on an older release.
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing — production deployment is blocked. Add both secrets (repo → Settings → Secrets → Actions) and re-run."
            exit 1
          fi
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Token preflight: a stale or IP-restricted token surfaces HERE as a
      # clear 9106 "authentication failed" with replacement instructions,
      # instead of a cryptic wrangler error swallowing the deploy. GitHub
      # runners are never on an IP allowlist, so an IP-restricted token can
      # never deploy from CI. OAuth is not usable in CI (interactive browser
      # flow) — a scoped account API token WITHOUT IP restriction is the only
      # supported path.
      - name: Verify Cloudflare API token (actionable 9106 error)
        if: steps.cf.outputs.available == 'true'
        run: |
          set -e
          RESP=$(curl -sS -w '\n%{http_code}' "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ] || ! printf '%s' "$BODY" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::Cloudflare API token REJECTED (HTTP $CODE). The CLOUDFLARE_API_TOKEN secret is invalid, expired, or IP-restricted — Cloudflare returns 9106 'authentication failed' because GitHub Actions runners are NOT in the token's IP allowlist. Fix: Cloudflare dashboard → My Profile → API Tokens → create a token scoped to your account with Cloudflare Pages:Edit and NO IP address restriction, then run: gh secret set CLOUDFLARE_API_TOKEN  (CLOUDFLARE_ACCOUNT_ID already exists and is correct). Re-run this workflow."
            echo "Cloudflare API response: $BODY"
            exit 1
          fi
          echo "Cloudflare API token verified: OK"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Pages preflight: a VALID token is not a sufficient condition for the
      # deploy. Wrangler's first call is a project GET, and Cloudflare answers
      # `Authentication error [code: 10000]` for BOTH "token lacks
      # Pages:Edit" and "project does not exist" — which is why a dozen deploys
      # (2026-09-25 → 27) failed with one ambiguous error. `scripts/pages-preflight.mjs`
      # tells the two apart, creates the project when it is simply missing, and
      # is runnable by hand with the same result. The logic lives in a script, not
      # in shell inside YAML: it can be unit-tested and re-run without CI. ──
      - name: Preflight for Cloudflare Pages (create the project if missing)
        if: steps.cf.outputs.available == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/pages-preflight.mjs

      # ── Deploy: Cloudflare Pages project (dypos-pos). This is the origin the
      # custom domain dypos.smartportssoft.com is bound to; the upload replaces
      # the deployment wholesale, so no stale chunk can survive (Pages keeps the
      # previous deployment only for rollback, not for serving). ──
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy POS/dist/pos --project-name=dypos-pos --branch=main --commit-dirty=true

      # واجهة API مستقلة عن Pages وتخدم `/api/*` على النطاق نفسه.
      - name: Deploy dypos-api Worker
        id: deploy_api
        if: steps.cf.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.api.toml

      # ── Deploy-time failure → one clear remediation line. ──
      - name: Deploy failed → actionable secret error
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Cloudflare Pages deploy FAILED. The step above ('Preflight: Pages project reachable') already proved whether the token may use the Pages API and whether the project exists — read ITS output first: it distinguishes 'no permission' from 'project missing' and prints the exact fix for the case it found. If the preflight passed and the deploy still failed, the token can read the project but cannot upload a deployment (an edited, older token): re-issue it with Cloudflare Pages:Edit, gh secret set CLOUDFLARE_API_TOKEN, re-run. All build gates before this step are green, so nothing about the code is in question."

      - name: API Worker deploy failed → actionable secret error
        if: failure() && steps.deploy_api.outcome == 'failure'
        run: |
          echo "::error::dypos-api Worker deploy FAILED. The token must include Workers Scripts:Edit and, when the route is changed or first created, Zone Workers Routes:Edit. Verify the account ID and re-run the workflow after updating CLOUDFLARE_API_TOKEN."

      # `/api/*` يخدمه Worker مستقل اسمه `dypos-api` (wrangler.api.toml)، وهو
      # بروكسي fail-closed إلى BACKEND_URL (سر wrangler، لا قيمة مدققة):
      # أي BACKEND_URL يحلّ إلى الحافة نفسها يرد 503 UPSTREAM_MISCONFIGURED
      # بدل حلقة طلبات — انظر بوابة npm run upstream أعلاه.

      # Optional cache purge — only when the zone id secret is provided
      # (Pages on a custom domain normally picks up instantly; kept for belt
      # and braces with Cloudflare's edge cache).
      - name: Purge Cloudflare cache (optional)
        if: steps.cf.outputs.available == 'true'
        continue-on-error: true
        run: |
          if [ -z "$CF_ZONE" ]; then echo "CF_ZONE_ID not set — skipping purge (Pages serves fresh deployments by default)."; exit 0; fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 300
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}

      # ── Live verification: customers must see the NEW build. One implementation
      # (`scripts/verify-live.mjs`) — the exact script the uptime heartbeat and a
      # human release check run, so the three can never disagree about what
      # "live" means. The version asserted here is the release version this
      # deploy built (`steps.ver`), which is why a release MUST bump the version:
      # otherwise a stale-but-valid 200 would pass a failed deploy. ──
      - name: Live verify (customers must see the new build)
        if: steps.cf.outputs.available == 'true'
        run: |
          # Pages/Cloudflare propagation can briefly lag. Retry the SAME release
          # contract instead of allowing a failed production verification to pass.
          for attempt in 1 2 3 4 5 6; do
            echo "Live verification attempt $attempt/6"
            if node scripts/verify-live.mjs --version="${{ steps.ver.outputs.version }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Production verification failed after 6 attempts. The deployment is not considered successful."
          exit 1
