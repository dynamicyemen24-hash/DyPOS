name: Deploy to Cloudflare (production)

# أي تعديل يُدمج في main يُبنى ويُنشر تلقائيًا إلى مشروع Cloudflare Pages
# (dypos-pos → dypos.smartportssoft.com) ثم يتحقق حيًا أن العملاء يرون الإصدار الجديد.
#
# لماذا Pages لا Workers: نطاق الإنتاج مُثبَت على مشروع Pages (تحقّقنا: رفع Pages
# يدويًا يحدّث أصول النطاق، وروابط SPA العميقة تُرجع 200). ومسار Workers لم ينجح
# ولا مرة (6 دفعات فاشلة)، وسبب التخلّي عنه أن التوكن آنذاك لم يكن يملك Pages:Edit.
# إذن الهدف Pages، والتوكن اللازم يجب أن يملك Pages:Edit.
#
# التخطيط: `build:pages` (base "/"، ويمسح outDir) هو نفس البناء الذي يخدم الإنتاج
# اليوم، وينتج `sw.js` في جذر النطاق بمدى "/" — وهو شرط تحكّم Service Worker
# في النطاق كاملًا. وحجم الميزانية يُقرأ من المخرجات نفسها.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build → Pages deploy → live verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version (single source = root package.json)
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: POS
        run: yarn install

      - name: Quality gate (vitest + noConsole lint)
        working-directory: POS
        run: npm run verify

      # Backend gates (deterministic subset of CI): the POS talks to the
      # Frappe-compat method router, so a deploy must prove the contract
      # (every POS call site resolves), lint, and schema parity. The full
      # backend suite + backup drills run in CI (server-api job).
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Backend gates (lint + method contract + schema parity)
        working-directory: server
        run: npm run lint && npm run contract && npm run parity

      # نفس البناء الذي يخدم الإنتاج: base "/" و sw.js في جذر النطاق، ويمسح
      # outDir أولًا فلا تتراكم قطع قديمة في قائمة precache (انظر pruneStaleAssetsPlugin).
      - name: Build frontend (version-pinned, no timestamps)
        working-directory: POS
        run: npm run build:pages
        env:
          DyPOS_BUILD_VERSION: ${{ steps.ver.outputs.version }}

      # Efficiency gate: fail the deploy on bundle bloat (900KB gzip budget).
      - name: Bundle budget (gzip JS+CSS cap)
        working-directory: POS
        run: npm run size

      # لا حاجة لتجميع موقع Worker: مخرجات build:pages هي موقع Pages كاملًا
      # (index.html + assets/ + sw.js + _headers + locales/ + workers/).
      # _redirects لا يُرفع: Pages يخدم fallback عبر قواعد النطاق، ووجود
      # catch-all في الملف كان مصدر حلقة إعادة توجيه لا نهائية (code 100324).

      # ── Gate: the deploy runs only when the Cloudflare secrets exist. ──
      # Missing secrets = the build/assembly still prove themselves on every
      # push; the publish waits for the owner to add them (see
      # docs/DEPLOYMENT_GUIDE.md → "النشر الآلي إلى Cloudflare").
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are missing — build verified, deploy SKIPPED. Add both secrets (repo → Settings → Secrets → Actions) and re-run."
          fi
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Token preflight: a stale or IP-restricted token surfaces HERE as a
      # clear 9106 "authentication failed" with replacement instructions,
      # instead of a cryptic wrangler error swallowing the deploy. GitHub
      # runners are never on an IP allowlist, so an IP-restricted token can
      # never deploy from CI. OAuth is not usable in CI (interactive browser
      # flow) — a scoped account API token WITHOUT IP restriction is the only
      # supported path.
      - name: Verify Cloudflare API token (actionable 9106 error)
        if: steps.cf.outputs.available == 'true'
        run: |
          set -e
          RESP=$(curl -sS -w '\n%{http_code}' "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN")
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$CODE" != "200" ] || ! printf '%s' "$BODY" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::Cloudflare API token REJECTED (HTTP $CODE). The CLOUDFLARE_API_TOKEN secret is invalid, expired, or IP-restricted — Cloudflare returns 9106 'authentication failed' because GitHub Actions runners are NOT in the token's IP allowlist. Fix: Cloudflare dashboard → My Profile → API Tokens → create a token scoped to your account with Cloudflare Pages:Edit and NO IP address restriction, then run: gh secret set CLOUDFLARE_API_TOKEN  (CLOUDFLARE_ACCOUNT_ID already exists and is correct). Re-run this workflow."
            echo "Cloudflare API response: $BODY"
            exit 1
          fi
          echo "Cloudflare API token verified: OK"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Deploy: Cloudflare Pages project (dypos-pos). This is the origin the
      # custom domain dypos.smartportssoft.com is bound to; the upload replaces
      # the deployment wholesale, so no stale chunk can survive (Pages keeps the
      # previous deployment only for rollback, not for serving). ──
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy DyPOS/public/pos --project-name=dypos-pos --branch=main --commit-dirty=true

      # ── Deploy-time failure → one clear remediation line. ──
      - name: Deploy failed → actionable secret error
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Cloudflare Pages deploy FAILED. CLOUDFLARE_API_TOKEN is invalid, expired, IP-restricted, or lacks Cloudflare Pages:Edit scope. Fix: Cloudflare dashboard → My Profile → API Tokens → Create Token (account scope, Cloudflare Pages:Edit) with NO IP address restriction — GitHub runners are never on an IP allowlist — then run: gh secret set CLOUDFLARE_API_TOKEN. CLOUDFLARE_ACCOUNT_ID already exists and is correct. Re-run this workflow."

      # ── لا خطوة لضبط أصل الواجهة الخلفية هنا.
      # `/api/*` يخدمه Worker مستقل اسمه `dypos-api` (wrangler.api.toml) عبر
      # route على نفس النطاق، وهو يجيب `/api/ping` بنفسه ولا يمرّر إلى Express
      # ولا يقرأ BACKEND_URL إطلاقًا. الخطوة القديمة كانت تكتب سرًّا لا يقرأه
      # أحد على Worker `dypos-pos`، فحُذفت. وخادم Express له مضيف منفصل. ──

      # Optional cache purge — only when the zone id secret is provided
      # (Pages on a custom domain normally picks up instantly; kept for belt
      # and braces with Cloudflare's edge cache).
      - name: Purge Cloudflare cache (optional)
        if: steps.cf.outputs.available == 'true'
        continue-on-error: true
        run: |
          if [ -z "$CF_ZONE" ]; then echo "CF_ZONE_ID not set — skipping purge (Pages serves fresh deployments by default)."; exit 0; fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 300
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}

      # ── Live verification: customers must see the NEW build. Rejects the
      # known-stale pre-1.36 bundle and any live HTML without a ?v= pin. ──
      - name: Live verify (customers must see the new build)
        if: steps.cf.outputs.available == 'true'
        continue-on-error: true
        run: |
          SITE="https://dypos.smartportssoft.com"
          VERSION="${{ steps.ver.outputs.version }}"
          sleep 20
          echo "Expected version: $VERSION"
          # build:pages ينشر version.json و index bundle في جذر النطاق، لا تحت
          # /assets/DyPOS/pos/ — المسار القديم كان يفشل بصمت لأنه يخص بناء Worker.
          LIVE_JSON=$(curl -fsS "$SITE/version.json" || true)
          echo "version.json → $LIVE_JSON"
          LIVE_HTML=$(curl -fsS "$SITE/" || true)
          BUNDLE=$(echo "$LIVE_HTML" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
          echo "index bundle → ${BUNDLE:-MISSING}"
          {
            echo "## Live verification"
            echo "- expected: $VERSION"
            echo "- version.json: ${LIVE_JSON:-NOT FOUND (404)}"
            echo "- index bundle: ${BUNDLE:-NOT FOUND}"
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$LIVE_JSON" | grep -q "$VERSION" && [ -n "$BUNDLE" ]; then
            # SPA fallback لازم: رابط عميق يجب أن يُرجع index.html لا 404،
            # وإلا حدّث العميل عبر Ctrl+F5 ينكسر.
            DEEP=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE/pos/deep-link-probe" || true)
            echo "deep-link probe → $DEEP"
            if [ "$DEEP" = "200" ]; then
              echo "✅ LIVE $VERSION VERIFIED — customers are on the new build."
            else
              echo "::warning::Version is live but SPA deep links return $DEEP instead of 200 — check the Pages project redirect rules for the custom domain."
            fi
          else
            echo "::warning::Live site does NOT serve the fresh $VERSION build yet. Pages deploy finished; the custom domain may point at another origin, or edge propagation may still be in flight."
          fi
