name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: DyPOS-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend Quality Gate
    defaults:
      run:
        working-directory: POS

    steps:
      - name: Clone
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: POS/package-lock.json

      # npm ci لا yarn install: لا yarn.lock متتبَّع، فكان yarn يثبّت نسخًا
      # عائمة تختلف عن POS/package-lock.json في كل تشغيل.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Quality Gate (tests + noConsole lint + typecheck)
        run: npm run verify

      # نفس البناء الذي ينشره deploy-cloudflare.yml (build:pages). كان
      # `yarn build` يبني تخطيط dypos(base /assets/DyPOS/pos/) وهو ليس ما
      # يذهب للإنتاج، فكانت البوابة لا تختبر الحزمة التي تُشحن.
      - name: Build
        run: npm run build:pages

      - name: Bundle budget (gzip JS+CSS cap)
        run: npm run size

  server-api:
    runs-on: ubuntu-latest
    name: DyPOS Server API (SQLite)
    defaults:
      run:
        working-directory: server
    steps:
      - name: Clone
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint (biome)
        run: npm run lint

      - name: Schema parity (SQLite ↔ Postgres)
        run: npm run parity

      - name: API regression tests (auth + invoices)
        run: npm test

      - name: Backup smoke (snapshot + integrity)
        run: npm run backup

      - name: Restore drill (verify newest backup)
        run: npm run backup:verify
