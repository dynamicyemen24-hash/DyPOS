name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: develop-DyPOS-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend Quality Gate
    defaults:
      run:
        working-directory: POS

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Install dependencies
        run: yarn install

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Windows bench-walk guard (frappe-ui/vite)
        # Regression gate: upstream utils.js walks to "/" which never matches
        # a Windows drive root and hangs vite before any output. The postinstall
        # patch hardens it; this fails the pipeline if a vulnerable guard
        # survives (e.g. lifecycle scripts skipped or upstream reworded).
        run: |
          if grep -rn "while (currentDir !== '/')" node_modules/frappe-ui/vite/ 2>/dev/null; then
            echo "::error::Unpatched bench-walk loop in frappe-ui/vite — vite would hang on Windows. Re-run: node scripts/patch-frappe-ui-windows.js"
            exit 1
          fi
          echo "bench-walk guard: clean"

      - name: Quality Gate (tests + noConsole lint)
        run: npm run verify

      - name: Build
        run: yarn build
        env:
          VITE_ROUTER_BASE: /

      - name: Bundle budget (gzip JS+CSS cap)
        run: npm run size

  server-api:
    runs-on: ubuntu-latest
    name: DyPOS Server API (SQLite)
    defaults:
      run:
        working-directory: server
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint (biome)
        run: npm run lint

      - name: Schema parity (SQLite ↔ Postgres)
        run: npm run parity

      - name: API regression tests (auth + invoices)
        run: npm test

      - name: Backup smoke (snapshot + integrity)
        run: npm run backup

      - name: Restore drill (verify newest backup)
        run: npm run backup:verify