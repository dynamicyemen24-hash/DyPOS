# DyPOS static site as Workers Static Assets.
# Deploy: wrangler deploy (assets from .pages-site).
# Domain route dypos.smartportssoft.com/* is attached on every deploy
# (Zone Workers Routes Edit is on CLOUDFLARE_API_TOKEN; also bound once via
# dashboard/API on 2026-09-24).
name = "dypos-pos"
main = "worker.js"
compatibility_date = "2026-09-24"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "dypos.smartportssoft.com/*"
zone_name = "smartportssoft.com"

[assets]
directory = ".pages-site"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
