# DyPOS PWA + API proxy
# Deploy: wrangler deploy
# Domain route dypos.smartportssoft.com/* attached via dashboard
name = "dypos-pos"
main = "worker.js"
compatibility_date = "2026-09-24"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "dypos.smartportssoft.com/*"
zone_name = "smartportssoft.com"

[vars]
BACKEND_URL = "https://dypos-api.smartportssoft.com"

[assets]
directory = ".pages-site"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
