# DyPOS API Edge Gateway (Cloudflare Workers)
# Same-origin /api/* gateway to the authoritative backend.
# The worker does not persist business data and must never act as a fake backend.
name = "dypos-api"
main = "worker-api.js"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[routes]]
pattern = "dypos.smartportssoft.com/api/*"
zone_name = "smartportssoft.com"

[vars]
BACKEND_URL = "https://dypos-api.smartportssoft.com"
