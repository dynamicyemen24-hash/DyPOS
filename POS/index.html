<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-accent="royal" data-density="comfortable">
	<head>
		<meta charset="UTF-8" />
		<script>
			// Runtime compatibility guard.
			// Some embedded/legacy SDKs expose a global namespace named Q and call
			// Q.setTimeout. If that namespace is present but incomplete, normalize
			// it before Vue/application code executes. Never create Q when absent:
			// this guard is containment for an existing external namespace only.
			(function () {
				try {
					var q = window.Q;
					if (
						q &&
						typeof q === "object" &&
						typeof q.setTimeout !== "function" &&
						typeof window.setTimeout === "function"
					) {
						q.setTimeout = window.setTimeout.bind(window);
					}
				} catch (e) {
					// Compatibility must never become a bootstrap dependency.
				}
			})();
		</script>
		<script>
			// DyPOS theme bootstrap — runs before any CSS paints to avoid FOUC.
			// Mirrors src/composables/useAppTheme.js persistence contract.
			(function () {
				try {
					var validTheme = { "light": 1, "dark": 1, "system": 1 };
					var validAccent = {
						"royal": 1, "indigo": 1, "violet": 1,
						"teal": 1, "emerald": 1, "rose": 1,
					};
					var validDensity = { "comfortable": 1, "compact": 1 };
					var mode = localStorage.getItem("DyPOS_theme");
					var accent = localStorage.getItem("DyPOS_accent");
					var density = localStorage.getItem("DyPOS_density");
					var root = document.documentElement;
					mode = validTheme[mode] ? mode : "system";
					accent = validAccent[accent] ? accent : "royal";
					density = validDensity[density] ? density : "comfortable";
					var dark = mode === "dark";
					if (mode === "system" && window.matchMedia) {
						dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
					}
					root.setAttribute("data-theme", dark ? "dark" : "light");
					root.setAttribute("data-accent", accent);
					root.setAttribute("data-density", density);
					root.style.colorScheme = dark ? "dark" : "light";
				} catch (e) {}
			})();
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes"
		/>
		<meta name="theme-color" content="#1E40AF" />
		<meta
			name="description"
			content="DyPOS — نظام نقاط بيع سمارت بورتس: فواتير ومخزون لحظي، تشغيل دون اتصال، مستخدمون متعددون، وربط مباشر بنظام ERP"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="DyPOS" />

		<!-- Brand favicons — root-relative on purpose: the same files then resolve
		     in `vite dev` (base "/"), in the embedded build (base /assets/DyPOS/pos/)
		     and in the Pages build, because Vite prefixes `base` on the way out.
		     Every path here is asserted against public/ by tests/brandingIdentity. -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/favicon-16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-32x32.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Cairo/Inter load locally via @fontsource — no Google Fonts round-trip,
		     and no flag CDN: flags are platform emoji (src/utils/flags.js).
		     Nothing in this shell may reach a third-party host: the PWA is
		     offline-first (AGENTS.md invariant 8). -->

		<!-- Company / Open Graph identity — the Smart Ports Software card
		     (public/smart-ports-og.jpg, 1200×630). Dimensions and type are declared
		     because crawlers size the card from them, and build-pages.mjs turns the
		     relative paths into absolute production URLs: Open Graph readers ignore
		     relative og:image, which is how a shared link lost its card. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Smart Ports Software" />
		<meta property="og:title" content="DyPOS — نظام نقاط بيع ذكي" />
		<meta
			property="og:description"
			content="DyPOS — نظام نقاط بيع سمارت بورتس: فواتير ومخزون لحظي، تشغيل دون اتصال، مستخدمون متعددون، وربط مباشر بنظام ERP"
		/>
		<meta property="og:url" content="/" />
		<meta property="og:locale" content="ar_SA" />
		<meta property="og:direction" content="rtl" />
		<meta property="og:image" content="/smart-ports-og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="شركة المنافذ الذكية للبرمجيات — DyPOS لنقاط البيع"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="DyPOS — نقاط بيع" />
		<meta
			name="twitter:description"
			content="DyPOS — نظام نقاط بيع سمارت بورتس: فواتير ومخزون لحظي، تشغيل دون اتصال، مستخدمون متعددون، وربط مباشر بنظام ERP"
		/>
		<meta name="twitter:image" content="/smart-ports-og.jpg" />
		<meta
			name="twitter:image:alt"
			content="شركة المنافذ الذكية للبرمجيات — DyPOS لنقاط البيع"
		/>

		<title>DyPOS — نقاط بيع</title>
	</head>

	<body>
		<noscript><div style="padding:24px;font-family:system-ui;text-align:center">DyPOS يتطلب JavaScript — فعّله ثم أعد التحميل.</div></noscript>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
